name: Push DVC experiments to GitLab
on:
  push:
    branches:
      - train-measure

jobs:
  push-exps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push refs/exps to GitLab (HTTPS / PAT)
        env:
          GITLAB_USER: haka
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GITLAB_URL: git.uni-paderborn.de/haka/mirror-finn-transformers.git
        run: |
          set -euo pipefail
          git remote add gitlab "https://${GITLAB_USER}:${GITLAB_PAT}@${GITLAB_URL}" || true
          git push --prune gitlab 'refs/exps/*:refs/exps/*' || true