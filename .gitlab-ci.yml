stages:
  - export
  - measure

variables:
  VENV_PATH: "/data/gitlab/builds/runner/.venv"
  VENV_BASE: "$CI_PROJECT_DIR/.venvs"
  PIP_CACHE_DIR: "/data/gitlab/pip-cache"
  DVC_LOGLEVEL: "ERROR"
  DVC_NO_ANALYTICS: "1"
  DVC_CHECK_UPDATE: "0"
  # Keep temporary files on /data (large partition).
  # This directory must exist and be writable by the gitlab-runner user.
  TMPDIR: "/data/gitlab/tmp"
  TMP: "/data/gitlab/tmp"
  TEMP: "/data/gitlab/tmp"

default:
  before_script:
   - mkdir -p /data/gitlab/tmp
   - export MODEL_TYPE=radioml  # radioml, language, vision
   - export FP16=0 # 0 or 1, only relevant if the model is not quantized already - decides if the measurements will be executed on FP16 or FP32 models (tensorrt internal PTQ)
   - export USE_DLA=0 # 0 or 1, decides if the measurements will be executed on DLA or GPU
   - export GPU_MEM_LIMIT_GB=32.0 # same limit for ORT and TRT

   - export CUDA_ROOT=/usr/local/cuda
   - export CFLAGS="-I/usr/local/cuda/include"
   - export CXXFLAGS="-I/usr/local/cuda/include"
   - export C_INCLUDE_PATH=/usr/local/cuda/include
   - export CPLUS_INCLUDE_PATH=/usr/local/cuda/include
   - export LIBRARY_PATH=/usr/local/cuda/lib64
   - export PYTHONPATH=/usr/lib/python3.10/dist-packages:${CI_PROJECT_DIR}:$PYTHONPATH  
   - export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
   - export LD_LIBRARY_PATH=${CI_PROJECT_DIR}/.cudnn_compat:$LD_LIBRARY_PATH
   - export PIP_CACHE_DIR=$PIP_CACHE_DIR

export-models:
  stage: export
  script:
    - mkdir -p $PIP_CACHE_DIR
    - mkdir -p "$VENV_BASE"
    - export VENV_DIR="$VENV_BASE/export-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - trap 'deactivate 2>/dev/null || true; rm -rf "$VENV_DIR"' EXIT
    - python3 -m venv "$VENV_DIR"
    - source "$VENV_DIR/bin/activate"
    - ls -l /usr/local/cuda/include/cuda.h

    - pip install --upgrade pip

    # ORT 1.17 / 1.16.3 environment for onnxsim/simplificatio
    - pip install onnxruntime==1.17.0
    - pip install torch==2.6.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126 -q
    - pip install -r requirements.txt

    - python3 -c "import tensorrt; print(tensorrt.__version__)"

    - dvc -q remote modify --local public timeout 600
    - dvc -q pull --allow-missing --force
    - dvc -q remote modify --local upload user $DVC_Sciebo_Upload_USER
    - dvc -q remote modify --local upload password $DVC_Sciebo_Upload_PASSWORD
    - dvc -q remote modify --local upload timeout 600

    - python3 -m measure.export_wrapper 2>&1 | grep -v "pthread_setaffinity_np failed"  # Ignore CPU affinity warnings - setting num_threads doesnt help
  artifacts:
    name: "exported-models-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - outputs/
  tags:
    - jetson

measure-job:
  stage: measure
  needs:
    - job: export-models
      artifacts: true
  script:
    - mkdir -p $PIP_CACHE_DIR
    - mkdir -p "$VENV_BASE"
    - export VENV_DIR="$VENV_BASE/measure-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - trap 'deactivate 2>/dev/null || true; rm -rf "$VENV_DIR"' EXIT
    - python3 -m venv "$VENV_DIR"
    - source "$VENV_DIR/bin/activate"
    - ls -l /usr/local/cuda/include/cuda.h

    - pip install --upgrade pip

    # ORT 1.20 environment for inference/measurement
    - pip install /data/onnxruntime/build/Linux/Release/dist/onnxruntime_gpu-1.20.0-cp310-cp310-linux_aarch64.whl
    - pip install torch==2.6.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126 -q
    - pip install -r requirements.txt

    - python3 -c "import tensorrt; print(tensorrt.__version__)"

    - dvc -q remote modify --local upload user $DVC_Sciebo_Upload_USER
    - dvc -q remote modify --local upload password $DVC_Sciebo_Upload_PASSWORD
    - dvc -q remote modify --local upload timeout 600

    - python3 -m measure.measure_onnxruntime      

    - python3 -m measure.measure

    - python3 -m measure.tegrastats_onnxruntime   
    - python3 -m measure.tegrastats               

    - python3 -m plots.plots

    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts

    - git config --global user.email "jetson@runner.com"
    - git config --global user.name "CI Runner"

    # Add plots to DVC and commit .dvc metadata
    - dvc add outputs/"$MODEL_TYPE"/plot || true
    - dvc_dvcs=$(git ls-files --others --exclude-standard outputs | grep '\.dvc$' || true)
    - git add $dvc_dvcs || true

    # Push DVC data to remote storage BEFORE saving experiment
    - dvc -q push -r upload

    # Save experiment checkpoint
    - dvc -q exp save -n "ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - dvc exp list --names-only
    - dvc -q push -r upload 
    - dvc -q exp push -r upload -f git@github.com:iksnagreb/finn-transformers.git "ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - ssh-agent -k
  tags:
    - jetson



