stages:
  - export
  - measure

variables:
  VENV_PATH: "/data/gitlab/builds/runner/.venv"

default:
  before_script:
   - export MODEL_TYPE=radioml  # radioml, language, vision
   - export FP16=0 # 0 or 1, only relevant if the model is not quantized already - decides if the measurements will be executed on FP16 or FP32 models (tensorrt internal PTQ)
   - export USE_DLA=1 # 0 or 1, decides if the measurements will be executed on DLA or GPU

   - export CUDA_ROOT=/usr/local/cuda
   - export CFLAGS="-I/usr/local/cuda/include"
   - export CXXFLAGS="-I/usr/local/cuda/include"
   - export C_INCLUDE_PATH=/usr/local/cuda/include
   - export CPLUS_INCLUDE_PATH=/usr/local/cuda/include
   - export LIBRARY_PATH=/usr/local/cuda/lib64
   - export PYTHONPATH=/usr/lib/python3.10/dist-packages:${CI_PROJECT_DIR}:$PYTHONPATH  
   - export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
   # Prepend the cuDNN compat dir so ORT 1.17/1.19 (built for cuDNN 8) finds
   # libcudnn.so.8 even though this runner ships cuDNN 9 (JP6 R36.4+).
   - export LD_LIBRARY_PATH=${CI_PROJECT_DIR}/.cudnn_compat:$LD_LIBRARY_PATH
   - export PIP_CACHE_DIR=$CI_PROJECT_DIR/.cache/pip

export-models:
  stage: export
  script:
    - mkdir -p $PIP_CACHE_DIR
    - python3 -m venv .venv-export
    - source .venv-export/bin/activate
    - ls -l /usr/local/cuda/include/cuda.h

    - pip install --upgrade pip

    # ORT 1.17 environment for onnxsim/simplification
    - pip install onnxruntime==1.17.0
    - pip install torch==2.6.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126 -q
    - pip install -r requirements.txt
    - pip freeze

    - python3 -c "import tensorrt; print(tensorrt.__version__)"

    - dvc pull --allow-missing    
    - dvc remote modify upload user $DVC_Sciebo_Upload_USER
    - dvc remote modify upload password $DVC_Sciebo_Upload_PASSWORD

    - python3 -m measure.export_wrapper

  artifacts:
    name: "exported-models-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - outputs/

  tags:
    - jetson

measure-job:
  stage: measure
  needs:
    - job: export-models
      artifacts: true
  script:
    - mkdir -p $PIP_CACHE_DIR
    - python3 -m venv .venv-measure
    - source .venv-measure/bin/activate
    - ls -l /usr/local/cuda/include/cuda.h

    - pip install --upgrade pip

    # ORT 1.20 environment for inference/measurement
    - pip install /data/onnxruntime/build/Linux/Release/dist/onnxruntime_gpu-1.20.0-cp310-cp310-linux_aarch64.whl
    - pip install torch==2.6.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126 -q
    - pip install -r requirements.txt
    - pip freeze

    - python3 -c "import tensorrt; print(tensorrt.__version__)"

    - dvc pull --allow-missing
    - dvc remote modify upload user $DVC_Sciebo_Upload_USER
    - dvc remote modify upload password $DVC_Sciebo_Upload_PASSWORD

    - python3 -m measure.measure_onnxruntime

    - python3 -m measure.measure

    - python3 -m measure.tegrastats

    - python3 -m plots.plots

    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts

    - git config --global user.email "jetson@runner.com"
    - git config --global user.name "CI Runner"

    - dvc push -r upload  
    - dvc exp push -r upload -f git@github.com:iksnagreb/finn-transformers.git    
    - ssh-agent -k
    # Trigger GitLab mirror sync so DataChain sees the new experiment immediately
    - |
      curl --silent --fail --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/mirror/pull"
  tags:
    - jetson

